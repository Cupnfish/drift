[workspace]
members = ["gui"]

[package]
name = "drift"
version = "0.1.0"
edition = "2024"
description = "Drift 局域网 P2P 文件 / 剪贴板传输核心（LANDrop 复刻，无 GUI）"

[lib]
name = "drift"
path = "src/lib.rs"

[[bin]]
name = "drift"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
thiserror = "2"
dirs = "6"
gethostname = "1"
hex = "0.4"
sha2 = "0.10"

# TLS：自签名 ed25519 证书 + 指纹锁定（不引入 aws-lc，统一 ring 后端）
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

# HTTP 服务与客户端（http1）
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "server", "server-auto", "tokio"] }
http-body-util = "0.1"
bytes = "1"

# 局域网发现（mDNS + UDP 广播回退）
mdns-sd = "0.21"
if-addrs = "0.13"

# 本地存储
redb = "2"

# 文件夹压缩发送
zip = { version = "2", default-features = false, features = ["deflate"] }

mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# nsh-platform-windows 0.3.0 本地补丁（.vendor/nsh-platform-windows）：
# 修复带 tint 的图片（所有图标）在 >100% DPI 屏幕上按 pt 值直接当物理像素绘制、
# 且锚在元素盒左上角的问题 —— Direct2D DrawImage 特效路径把位图按其 96 DPI 对
# 目标 DPI 折算自然尺寸，缺乘 cx.scale。上游修复后可移除本补丁。
[patch.crates-io]
nsh-platform-windows = { path = '.vendor/nsh-platform-windows' }
