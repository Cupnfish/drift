<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Drift 配对与信任</title>
  <desc id="desc">本地配对流程板：桌面端自动发现附近设备，配对时两端显示同一组六位码供核对；列出等待确认、配对成功、号码不一致三种状态，以及自动发现、一码对照、双向确认、随时撤销四条规则。配对码只用于对照，不需要输入。</desc>
