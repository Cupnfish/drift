      <stop stop-color="#F6F8FC"/>
      <stop offset="1" stop-color="#EDF0F7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6D64F6"/>
      <stop offset="1" stop-color="#5046E5"/>
    </linearGradient>
    <filter id="card" x="-10%" y="-10%" width="120%" height="125%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#25304A" flood-opacity="0.06"/>
    </filter>
    <filter id="phone" x="-20%" y="-10%" width="140%" height="120%" color-interpolation-filters="sRGB">
