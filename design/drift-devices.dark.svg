<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="800" viewBox="0 0 1080 800" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Drift 设备命名（自己改名 · 对方改名 · 重复去重）</title>
  <desc id="desc">设备命名规则板。自己是设备名只在配对时展示给对方，未改名前默认用设备型号；给对方的设备改名只影响自己的列表，不改动对方设备。显示规则：昵称或设备名二选一，两者一致时只显示一次。下方三张示意分别覆盖已改名、未改名、名字与型号相同三种情况。</desc>
  <defs>
    <radialGradient id="halo" cx=".5" cy=".34" r=".64">
      <stop offset="0" stop-color="#8E86FF" stop-opacity=".09"/>
      <stop offset="1" stop-color="#8E86FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8E86FF"/>
      <stop offset="1" stop-color="#7A70F5"/>
    </linearGradient>
    <filter id="windowShadow" x="0" y="0" width="1080" height="800" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#000000" flood-opacity="0.20"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-14%" width="120%" height="132%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000000" flood-opacity="0.09"/>
    </filter>
    <filter id="orbShadow" x="-70%" y="-70%" width="240%" height="260%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="11" flood-color="#000000" flood-opacity="0.11"/>
    </filter>
    <clipPath id="appClip"><rect x="24" y="24" width="1032" height="752" rx="20"/></clipPath>
        <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3 9.8 14.2M21 3l-7.2 18-4-6.8L3 10.2 21 3Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-laptop" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M2.5 20h19M8 20l.7-4h6.6l.7 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5" stroke="currentColor" stroke-width="1.7"/><path d="M10 5h4M11 18.5h2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 2.8h8l4 4V21H6V2.8Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M14 3v4h4M9 12h6M9 16h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6.5h7l2-2h9v15H3v-13Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M3 9h18" stroke="currentColor" stroke-width="1.7"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4l10.5-10.5a2.4 2.4 0 0 0-3.4-3.4L4.6 16.6 4 20Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m13.6 7.4 3 3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></symbol>
    <symbol id="i-radar" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.6a9.4 9.4 0 0 1 9.4 9.4M12 6.2a5.8 5.8 0 0 1 5.8 5.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.2 4.2L19 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M16 8V4H4v12h4" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v11m0 0 4-4m-4 4-4-4M4 19h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 6h16M9 6V3h6v3M6.5 6l1 15h9l1-15M10 10v7M14 10v7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M8 21h8M12 17v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-tray" viewBox="0 0 24 24"><path d="M12 3v9m0 0 3.4-3.4M12 12 8.6 8.6M4 15v5h16v-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-cursor" viewBox="0 0 24 24"><path d="M5.2 3.2 19 11.8l-6.1 1.4-2.7 6.2L5.2 3.2Z" fill="currentColor" stroke="#FFFFFF" stroke-width="1.4" stroke-linejoin="round"/></symbol>
    <symbol id="i-tablet" viewBox="0 0 24 24"><rect x="4.5" y="2.5" width="15" height="19" rx="2.6" stroke="currentColor" stroke-width="1.7"/><path d="M10.5 18.5h3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/><path d="M12 7.5V12l3 2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.2 19 6v6c0 4.4-3 7.4-7 9-4-1.6-7-4.6-7-9V6l7-2.8Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m9 12 2 2 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M9.5 14.5 14.5 9.5M8.5 10.5 6.2 12.8a3.6 3.6 0 0 0 5 5l2.3-2.3M15.5 13.5l2.3-2.3a3.6 3.6 0 0 0-5-5l-2.3 2.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-unlink" viewBox="0 0 24 24"><path d="M8.5 10.5 6.2 12.8a3.6 3.6 0 0 0 5 5l2.3-2.3M15.5 13.5l2.3-2.3a3.6 3.6 0 0 0-5-5l-2.3 2.3M4 4l16 16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3.5 21 20H3L12 3.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 9v5M12 17.2h.1" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/> <path d="M20 4.2v4.6h-4.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.8 12S6.5 5.8 12 5.8 21.2 12 21.2 12 17.5 18.2 12 18.2 2.8 12 2.8 12Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/> <circle cx="12" cy="12" r="2.8" stroke="currentColor" stroke-width="1.7"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15M14 7l5 5-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <style>
      text { font-family: Inter, "SF Pro Display", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace; letter-spacing: .03em; }
      .ink { fill: #F1F4FA; }
      .body { fill: #D2D9E6; }
      .muted { fill: #A6AEBF; }
      .faint { fill: #8B93A6; }
      .ui { font-variant-numeric: tabular-nums; }
    </style>
  </defs>

  <rect width="1080" height="800" fill="#101419"/>
  <rect width="1080" height="800" fill="url(#halo)"/>
  <g filter="url(#windowShadow)"><rect x="24" y="24" width="1032" height="752" rx="20" fill="#171B24" stroke="#333A4B" stroke-width="1.2"/></g>

  <g clip-path="url(#appClip)">
    <rect x="24" y="24" width="1032" height="752" fill="#171B24"/>

    <!-- 顶栏 -->
    <path d="M24 80h1032" stroke="#262C39"/>
    <rect x="44" y="38" width="27" height="27" rx="8" fill="url(#mark)"/>
    <use href="#i-send" x="49.5" y="43.5" width="16" height="16" color="#FFFFFF"/>
    <text x="84" y="58" class="ink" font-size="18" font-weight="650" letter-spacing="-.02em">Drift</text>
    <text x="1040" y="58" class="mono faint ui" font-size="10.5" text-anchor="end">设备命名 · v1.5 · 2026.11</text>

    <text x="96" y="124" class="ink" font-size="20" font-weight="650" letter-spacing="-.015em">设备改名</text>
    <text x="96" y="147" class="mono faint ui" font-size="10.5">名字只用于显示；没改过就用设备型号，两者相同只显示一个</text>

    <!-- ══ A · 自己的设备：名字会传给对方 ══ -->
    <g filter="url(#cardShadow)"><rect x="96" y="180" width="440" height="272" rx="18" fill="#171B24" stroke="#333A4B" stroke-width="1.2"/></g>
    <rect x="120" y="204" width="34" height="34" rx="10" fill="url(#mark)"/>
    <use href="#i-laptop" x="127" y="211" width="20" height="20" color="#FFFFFF"/>
    <text x="168" y="217" class="ink" font-size="14" font-weight="650">这台设备</text>
    <text x="168" y="234" class="mono faint ui" font-size="10.5">改名后，配对时对方看到的就是它</text>
    <text x="512" y="218" class="mono faint ui" font-size="10" text-anchor="end">本机</text>

    <rect x="120" y="262" width="392" height="46" rx="12" fill="#171B24" stroke="#8E86FF" stroke-width="1.4"/>
    <text x="138" y="291" class="ink" font-size="15" font-weight="600">小林的 Mac mini</text>
    <rect x="252" y="275" width="1.6" height="20" rx=".8" fill="#8E86FF"/>
    <use href="#i-pencil" x="482" y="276" width="15" height="15" color="#A79FFF"/>

    <text x="120" y="330" class="mono faint ui" font-size="10.5">设备型号 · Mac mini（macOS 14）</text>
    <text x="512" y="330" class="mono faint ui" font-size="10" text-anchor="end">默认值</text>

    <path d="M120 350h392" stroke="#262C39"/>
    <text x="120" y="374" class="mono faint ui" font-size="10.5">名字会随配对广播给同一 Wi-Fi 下的设备，随时可改</text>
    <use href="#i-refresh" x="120" y="392" width="13" height="13" color="#A79FFF"/>
    <text x="140" y="403" fill="#B0A8FF" font-size="11.5" font-weight="600">改回设备名称「Mac mini」</text>
    <text x="512" y="403" class="mono faint ui" font-size="10" text-anchor="end">不填 = 型号</text>

    <!-- ══ B · 别人的设备：只改本地显示 ══ -->
    <g filter="url(#cardShadow)"><rect x="592" y="180" width="392" height="272" rx="18" fill="#171B24" stroke="#333A4B" stroke-width="1.2"/></g>
    <circle cx="628" cy="222" r="17" fill="#1C212C" stroke="#333A4B" stroke-width="1.1"/>
    <use href="#i-monitor" x="622" y="214" width="14" height="14" color="#A6AEBF"/>
    <text x="660" y="217" class="ink" font-size="14" font-weight="650">客厅 Windows</text>
    <text x="660" y="234" class="mono faint ui" font-size="10.5">Windows 台式机 · 已配对 3 天</text>

    <rect x="616" y="262" width="344" height="46" rx="12" fill="#171B24" stroke="#8E86FF" stroke-width="1.4"/>
    <text x="634" y="291" class="ink" font-size="15" font-weight="600">客厅 Windows</text>
    <rect x="734" y="275" width="1.6" height="20" rx=".8" fill="#8E86FF"/>
    <use href="#i-pencil" x="930" y="276" width="15" height="15" color="#A79FFF"/>

    <text x="616" y="330" class="mono faint ui" font-size="10.5">设备型号 · Windows 台式机</text>
    <text x="960" y="330" class="mono faint ui" font-size="10" text-anchor="end">已改名</text>
    <path d="M616 350h344" stroke="#262C39"/>
    <text x="616" y="374" class="mono faint ui" font-size="10.5">只改你这里看到的称呼，对方设备不受影响</text>
    <text x="960" y="403" class="mono faint ui" font-size="10" text-anchor="end">只在本机生效</text>

    <!-- ══ C · 显示规则：三种情况的实际渲染 ══ -->
    <text x="96" y="496" class="ink" font-size="14" font-weight="650">列表里怎么显示</text>
    <text x="96" y="515" class="mono faint ui" font-size="10.5">名字 → 型号，两者相同时合并为一行</text>

    <!-- 已改名：两行 -->
    <g filter="url(#cardShadow)"><rect x="96" y="536" width="288" height="132" rx="16" fill="#171B24" stroke="#333A4B" stroke-width="1.2"/></g>
    <circle cx="130" cy="574" r="20" fill="#1C212C" stroke="#262C39" stroke-width="1.1"/>
    <use href="#i-monitor" x="122" y="566" width="16" height="16" color="#A6AEBF"/>
    <text x="164" y="572" class="ink" font-size="13.5" font-weight="600">客厅 Windows</text>
    <text x="164" y="590" class="mono faint ui" font-size="10.5">Windows 台式机</text>
    <text x="120" y="628" class="mono faint ui" font-size="10">昵称 + 型号</text>

    <!-- 未改名：只有一行 -->
    <g filter="url(#cardShadow)"><rect x="396" y="536" width="288" height="132" rx="16" fill="#171B24" stroke="#333A4B" stroke-width="1.2"/></g>
    <circle cx="430" cy="574" r="20" fill="#1C212C" stroke="#262C39" stroke-width="1.1"/>
    <use href="#i-laptop" x="422" y="566" width="16" height="16" color="#A6AEBF"/>
    <text x="464" y="572" class="ink" font-size="13.5" font-weight="600">MacBook Air</text>
    <text x="464" y="590" class="mono faint ui" font-size="10.5">没改过名 · 直接用型号</text>
    <text x="420" y="628" class="mono faint ui" font-size="10">只剩型号</text>

    <!-- 名字与型号相同：只显示一次 -->
    <g filter="url(#cardShadow)"><rect x="696" y="536" width="288" height="132" rx="16" fill="#171B24" stroke="#333A4B" stroke-width="1.2"/></g>
    <circle cx="730" cy="574" r="20" fill="#1C212C" stroke="#262C39" stroke-width="1.1"/>
    <use href="#i-phone" x="722" y="566" width="16" height="16" color="#A6AEBF"/>
    <text x="764" y="572" class="ink" font-size="13.5" font-weight="600">iPhone 15</text>
    <text x="764" y="590" class="mono faint ui" font-size="10.5">名字与型号一致 · 只显示一个</text>
    <text x="720" y="628" class="mono faint ui" font-size="10">不重复</text>

    <!-- 规则脚注 -->
    <path d="M96 694h888" stroke="#262C39"/>
    <text x="96" y="722" class="mono faint ui" font-size="10.5">名字长度上限 24 字；清空输入框等于改回型号</text>
    <text x="984" y="722" class="mono faint ui" font-size="10.5" text-anchor="end">改名不会触发重传</text>
  </g>
</svg>
