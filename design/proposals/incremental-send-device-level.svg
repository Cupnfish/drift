      <rect x="666" y="515" width="316" height="82" rx="12" fill="#F0F8F5"/>
      <circle cx="688" cy="545" r="11" fill="#DFF2E9"/>
      <path d="m683 545 3.5 3.5 6.5-7" stroke="#32866A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="709" y="543" class="green" font-size="11" font-weight="650">当前内容已全部送达</text>
      <text x="709" y="563" class="muted" font-size="9.5">此设备没有待补发项</text>
      <rect x="1000" y="534" width="130" height="40" rx="12" fill="#FFFFFF" stroke="#D5EEE2"/>
      <path d="m1017 554 3.5 3.5 7-8" stroke="#32866A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1074" y="559" text-anchor="middle" class="green" font-size="10.5" font-weight="700">已是最新</text>
    </g>

    <path d="M132 646H1148" stroke="#EFF0F5"/>
    <circle cx="141" cy="673" r="4" fill="#B45808"/>
    <text x="154" y="677" class="muted" font-size="10">增量按设备分别计算 · 卡片仅显示该设备本次待发送内容</text>
    <text x="1148" y="677" text-anchor="end" class="faint" font-size="10">点按设备卡片立即发送或补发</text>

    <!-- Plain composer: complete draft, with no diff marks or delta badge -->
    <rect x="108" y="776" width="1064" height="82" rx="22" fill="#FFFFFF" stroke="#D6D1FA" stroke-width="1.3" filter="url(#composerShadow)"/>
    <rect x="126" y="796" width="42" height="42" rx="13" fill="#F2F3F8"/>
    <path d="M147 806v22M136 817h22" stroke="#5F6678" stroke-width="1.7" stroke-linecap="round"/>
    <text x="190" y="826" class="ink" font-size="14">这版稿子周五前定稿，工厂部分我下午再确认。</text>
    <rect x="813" y="796" width="176" height="42" rx="13" fill="#FAF9FF" stroke="#8578EA" stroke-width="1.2" stroke-dasharray="5 4"/>
    <path d="M835 806v15m0 0-5-5m5 5 5-5M828 826h14" stroke="#5A4FE2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="853" y="814" fill="#4E43C8" font-size="10.5" font-weight="650">拖入文件</text>
    <text x="853" y="829" fill="#7A739F" font-size="9">或点击选择</text>
    <rect x="1001" y="796" width="76" height="42" rx="12" fill="#F3F4F8"/>
    <path d="m1017 810 10 10m0-10-10 10" stroke="#5A6276" stroke-width="1.4" stroke-linecap="round"/>
    <text x="1048" y="822" text-anchor="middle" class="muted" font-size="10.5" font-weight="600">清空</text>
    <text x="640" y="881" text-anchor="middle" class="faint" font-size="9.5">输入区始终只保留当前完整内容，不按设备拆分或标记 diff</text>
  </g>
</svg>
