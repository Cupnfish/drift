    <path d="M132 254H1148" stroke="#EFF0F5"/>

    <!-- Device 1: device-specific appended text -->
    <g>
      <rect x="132" y="270" width="500" height="172" rx="18" fill="#FFFCF6" stroke="#F0D7B3" stroke-width="1.2"/>
      <rect x="132" y="288" width="3" height="136" rx="1.5" fill="#D78B34"/>
      <circle cx="169" cy="301" r="21" fill="#FFFFFF" stroke="#F3D9B1"/>
      <rect x="158" y="293" width="22" height="15" rx="2" stroke="#9A520C" stroke-width="1.5"/>
      <path d="M155 312h28M163 312l1-4h10l1 4" stroke="#9A520C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="202" y="298" class="ink" font-size="12.5" font-weight="700">MacBook Pro</text>
      <text x="202" y="316" class="faint" font-size="9.5">上次已同步 v1 · 在线</text>
      <rect x="490" y="284" width="120" height="23" rx="11.5" fill="#FFF4DF" stroke="#F3D9B1"/>
      <circle cx="504" cy="295.5" r="3.3" fill="#B45808"/>
      <text x="552" y="299" text-anchor="middle" class="delta" font-size="9.5" font-weight="700">待补发 · 文本追加</text>
      <rect x="150" y="331" width="316" height="82" rx="12" fill="#FFF7E8"/>
      <text x="164" y="351" fill="#9A520C" font-size="9.5" font-weight="700" letter-spacing=".03em">本次增量 · 新增 18 字</text>
      <text x="164" y="375" class="ink" font-size="11.5" font-weight="550">“工厂部分我下午再确认。”</text>
      <text x="164" y="397" class="faint" font-size="9">只向此设备补发这段追加文本</text>
      <rect x="484" y="350" width="130" height="40" rx="12" fill="#B45808"/>
      <path d="M500 370a7 7 0 1 1 2.3 5.2M500 365v5h5" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="557" y="375" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700">补发文本增量</text>
    </g>

    <!-- Device 2: different incremental files -->
    <g>
      <rect x="648" y="270" width="500" height="172" rx="18" fill="#FFFCF6" stroke="#F0D7B3" stroke-width="1.2"/>
