    <path d="M1126 130h20M1130 137h12M1134 144h4" stroke="#5F6678" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="1181" cy="135" r="7" stroke="#5F6678" stroke-width="1.6"/>
    <path d="m1186 140 5 5" stroke="#5F6678" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="1211" cy="135" r="1.5" fill="#5F6678"/><circle cx="1217" cy="135" r="1.5" fill="#5F6678"/><circle cx="1223" cy="135" r="1.5" fill="#5F6678"/>

    <!-- Quiet transfer history underneath the device sheet -->
    <path d="M90 202h320M590 202h530" stroke="#E8EAF1"/>
    <rect x="410" y="190" width="180" height="24" rx="12" fill="#F1F3F7"/>
    <text x="500" y="206" text-anchor="middle" class="faint" font-size="10.5">今天 · 传输会话</text>
    <rect x="78" y="224" width="270" height="91" rx="16" fill="#FFFFFF" stroke="#E5E8F0"/>
    <rect x="94" y="241" width="40" height="40" rx="12" fill="#F0EEFF"/>
    <path d="M105 249h11l5 5v18h-16v-23Z" stroke="#6459E9" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M116 249v5h5M109 260h8M109 265h6" stroke="#6459E9" stroke-width="1.3" stroke-linecap="round"/>
    <text x="146" y="255" class="ink" font-size="11.5" font-weight="650">方案初稿.pdf</text>
    <text x="146" y="274" class="faint" font-size="10">来自 MacBook Pro · 14:22</text>
    <circle cx="103" cy="296" r="6" fill="#E7F5EF"/><path d="m100 296 2 2 4-4" stroke="#2C9A73" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="115" y="300" fill="#32866A" font-size="9.5">已接收</text>
    <rect x="872" y="222" width="290" height="78" rx="18" fill="url(#sendButton)"/>
    <text x="894" y="253" fill="#FFFFFF" font-size="12.5">收到，我把修订内容和文件一起补齐了。</text>
    <text x="894" y="275" fill="#FFFFFF" opacity=".82" font-size="11">请看各设备卡片中的待同步项</text>
    <rect x="32" y="172" width="1216" height="628" fill="#FBFCFE" opacity=".57"/>

    <!-- Send-to-device panel -->
    <g filter="url(#panelShadow)"><rect x="104" y="180" width="1072" height="574" rx="26" fill="#FFFFFF" stroke="#D6D1FA" stroke-width="1.2"/></g>
    <rect x="132" y="202" width="40" height="40" rx="13" fill="#EEF0FF"/>
    <path d="m143 222 17-9-6.7 19-3.8-6.6-6.5-3.4Z" stroke="#584DE5" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="m150 225 10-12" stroke="#584DE5" stroke-width="1.3" stroke-linecap="round"/>
    <text x="184" y="218" class="ink" font-size="16" font-weight="750">发送至设备</text>
    <text x="184" y="237" class="muted" font-size="10.5">点击设备发送 · 已发送设备仅补发各自未同步的内容</text>

    <rect x="902" y="207" width="146" height="32" rx="11" fill="#EEF0FF" stroke="#D6D1FA"/>
    <text x="975" y="227" text-anchor="middle" fill="#5A50E8" font-size="10.5" font-weight="650">发送给待发送设备</text>
