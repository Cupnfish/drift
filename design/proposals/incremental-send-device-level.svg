<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Drift 增量发送 · 设备级内容预览设计提案</title>
  <desc id="desc">设计提案：输入框只展示完整、未标记的当前内容；每台设备卡片独立展示该设备待补发的文本片段或新增文件。画面包含文本追加、文件新增、文本修改和已同步四种设备状态。</desc>
  <defs>
    <linearGradient id="boardBg" x1="85" y1="12" x2="1196" y2="932" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4F6FB"/>
      <stop offset="1" stop-color="#E9EDF5"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7168FF"/>
      <stop offset="1" stop-color="#554BE6"/>
    </linearGradient>
    <linearGradient id="sendButton" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7168FF"/>
      <stop offset="1" stop-color="#554BE6"/>
    </linearGradient>
    <filter id="windowShadow" x="0" y="0" width="1280" height="940" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="15" stdDeviation="24" flood-color="#25304A" flood-opacity="0.14"/>
    </filter>
    <filter id="panelShadow" x="-10%" y="-15%" width="120%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="11" stdDeviation="18" flood-color="#202943" flood-opacity="0.13"/>
    </filter>
    <filter id="composerShadow" x="-8%" y="-25%" width="116%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#28314B" flood-opacity="0.07"/>
    </filter>
    <clipPath id="windowClip"><rect x="32" y="104" width="1216" height="800" rx="26"/></clipPath>
    <style>
      text { font-family: Inter, "SF Pro Display", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .ink { fill: #202331; }
      .body { fill: #3A4155; }
      .muted { fill: #5A6276; }
      .faint { fill: #6A7284; }
      .delta { fill: #7C3F06; }
      .green { fill: #2C7A60; }
    </style>
  </defs>

  <rect width="1280" height="940" fill="url(#boardBg)"/>
  <circle cx="1206" cy="82" r="184" fill="#DCDFFC" opacity=".36"/>
  <circle cx="70" cy="900" r="170" fill="#D8ECE8" opacity=".34"/>

  <!-- Design-board heading -->
  <rect x="48" y="31" width="113" height="24" rx="12" fill="#EDEEFF"/>
  <text x="104.5" y="47" text-anchor="middle" fill="#5A50E8" font-size="10" font-weight="750" letter-spacing=".08em">DESIGN PROPOSAL</text>
  <text x="48" y="82" class="ink" font-size="25" font-weight="750" letter-spacing="-.035em">增量发送 · 设备级内容预览</text>
  <text x="456" y="80" class="muted" font-size="12.5">输入框保持干净完整；每台设备只呈现自己尚未同步的部分</text>
  <text x="1232" y="48" text-anchor="end" class="faint" font-size="10.5">桌面端概念稿 · 01</text>

  <!-- App window -->
  <g filter="url(#windowShadow)"><rect x="32" y="104" width="1216" height="800" rx="26" fill="#FFFFFF"/></g>
  <g clip-path="url(#windowClip)">
    <rect x="32" y="104" width="1216" height="800" fill="#FBFCFE"/>
    <rect x="32" y="104" width="1216" height="68" fill="#FFFFFF"/>
    <path d="M32 172H1248" stroke="#E8EAF1"/>
    <rect x="56" y="121" width="36" height="36" rx="12" fill="url(#brand)"/>
    <path d="m65 139 18-9-7 20-4-7-7-4Z" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="m72 143 11-13" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <text x="104" y="146" class="ink" font-size="21" font-weight="750" letter-spacing="-.04em">Drift</text>
    <path d="M1002 130h17l3-4h17v23h-37v-19Z" stroke="#5F6678" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M1002 135h37" stroke="#5F6678" stroke-width="1.5"/>
