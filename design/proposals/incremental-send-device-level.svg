      <rect x="150" y="515" width="316" height="82" rx="12" fill="#FFF7E8"/>
      <text x="164" y="535" fill="#9A520C" font-size="9.5" font-weight="700" letter-spacing=".03em">本次增量 · 当前内容与该设备不同</text>
      <text x="164" y="559" class="ink" font-size="11.5" font-weight="550">“请以本版为准，周三前完成交付。”</text>
      <text x="164" y="581" class="faint" font-size="9">按此设备上次发送记录计算补发内容</text>
      <rect x="484" y="534" width="130" height="40" rx="12" fill="#B45808"/>
      <path d="M500 554a7 7 0 1 1 2.3 5.2M500 549v5h5" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="557" y="559" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700">更新此设备</text>
    </g>

    <!-- Device 4: already current, so no delta preview -->
    <g>
      <rect x="648" y="454" width="500" height="172" rx="18" fill="#F8FCFA" stroke="#D5EEE2" stroke-width="1.2"/>
      <circle cx="685" cy="485" r="21" fill="#FFFFFF" stroke="#D5EEE2"/>
