      <rect x="1006" y="284" width="120" height="23" rx="11.5" fill="#FFF4DF" stroke="#F3D9B1"/>
      <circle cx="1020" cy="295.5" r="3.3" fill="#B45808"/>
      <text x="1068" y="299" text-anchor="middle" class="delta" font-size="9.5" font-weight="700">待补发 · 新增文件</text>
      <rect x="666" y="331" width="316" height="82" rx="12" fill="#FFF7E8"/>
      <text x="680" y="351" fill="#9A520C" font-size="9.5" font-weight="700" letter-spacing=".03em">本次增量 · 2 个新文件</text>
      <rect x="680" y="360" width="288" height="22" rx="7" fill="#FFFFFF" stroke="#F3D9B1"/>
      <path d="M690 366h7l3 3v8h-10v-11Z" stroke="#B45808" stroke-width="1.1" stroke-linejoin="round"/>
      <path d="M697 366v3h3" stroke="#B45808" stroke-width="1"/>
      <text x="706" y="375" class="body" font-size="9.5" font-weight="550">品牌规范.pdf</text>
      <text x="956" y="375" text-anchor="end" class="faint" font-size="8.5">4.8 MB</text>
      <rect x="680" y="386" width="288" height="22" rx="7" fill="#FFFFFF" stroke="#F3D9B1"/>
      <path d="M690 392h7l3 3v8h-10v-11Z" stroke="#B45808" stroke-width="1.1" stroke-linejoin="round"/>
      <path d="M697 392v3h3" stroke="#B45808" stroke-width="1"/>
      <text x="706" y="401" class="body" font-size="9.5" font-weight="550">流程图-v3.png</text>
      <text x="956" y="401" text-anchor="end" class="faint" font-size="8.5">820 KB</text>
      <rect x="1000" y="350" width="130" height="40" rx="12" fill="#B45808"/>
      <path d="M1017 362v14m0 0-5-5m5 5 5-5M1010 379h14" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1074" y="375" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700">补发 2 个文件</text>
    </g>

    <!-- Device 3: edited content differs from its own snapshot -->
    <g>
      <rect x="132" y="454" width="500" height="172" rx="18" fill="#FFFCF6" stroke="#F0D7B3" stroke-width="1.2"/>
      <rect x="132" y="472" width="3" height="136" rx="1.5" fill="#D78B34"/>
      <circle cx="169" cy="485" r="21" fill="#FFFFFF" stroke="#F3D9B1"/>
