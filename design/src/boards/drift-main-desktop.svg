<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="800" viewBox="0 0 1080 800" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Drift 桌面端主界面（无发送键 · 设备球体 · 增量发送）</title>
  <desc id="desc">桌面端主界面，窗口宽 1080。输入区没有发送键，输入框只显示正在编辑的文字，不标注任何差异。输入框一有内容，附近设备以漂浮球体的形式浮在会话上方；状态画在球体的环上：虚线橙环表示内容改过、点按只补发 +12 字，绿色整环表示已同步，紫色进度环表示传输中，灰色部分环表示已暂停。球体大小表示远近与活跃度。点按球体即发送，可以连续点几个球发给几台。清空输入后球体收起，回到会话。</desc>
  <defs>
    <radialGradient id="halo" cx=".5" cy=".38" r=".62">
      <stop offset="0" stop-color="{{accent}}" stop-opacity=".10"/>
      <stop offset="1" stop-color="{{accent}}" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx=".34" cy=".26" r=".9">
      <stop offset="0" stop-color="{{surface}}"/>
      <stop offset=".56" stop-color="{{surface}}"/>
      <stop offset="1" stop-color="{{sunken}}"/>
    </radialGradient>
    <radialGradient id="orbHot" cx=".34" cy=".26" r=".9">
      <stop offset="0" stop-color="{{surface}}"/>
      <stop offset=".5" stop-color="{{accent-wash}}"/>
      <stop offset="1" stop-color="{{sunken}}"/>
    </radialGradient>
    <radialGradient id="spec" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="{{on-accent}}" stop-opacity=".72"/>
      <stop offset="1" stop-color="{{on-accent}}" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="{{accent}}"/>
      <stop offset="1" stop-color="{{accent-strong}}"/>
    </linearGradient>
    <filter id="windowShadow" x="0" y="0" width="1080" height="800" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="{{shadow}}" flood-opacity="0.20"/>
    </filter>
    <filter id="orbShadow" x="-70%" y="-70%" width="240%" height="260%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="11" flood-color="{{shadow}}" flood-opacity="0.11"/>
    </filter>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur2" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="composerHeat" x="-6%" y="-40%" width="112%" height="190%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="14" flood-color="{{accent}}" flood-opacity="0.13"/>
    </filter>
    <clipPath id="appClip"><rect x="24" y="24" width="1032" height="752" rx="20"/></clipPath>
    <clipPath id="sonarClip"><rect x="24" y="80" width="1032" height="576"/></clipPath>
    <!-- @icons -->
    <style>
      text { font-family: Inter, "SF Pro Display", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace; letter-spacing: .03em; }
      .ink { fill: {{ink}}; }
      .body { fill: {{body}}; }
      .muted { fill: {{muted}}; }
      .faint { fill: {{faint}}; }
      .ui { font-variant-numeric: tabular-nums; }
      .caret { animation: drift-blink 1.1s steps(1) infinite; }
      .bob { animation: drift-bob 7s ease-in-out infinite; }
      .b1 { animation-duration: 7.6s; animation-delay: -.7s; }
      .b2 { animation-duration: 6.5s; animation-delay: -2.2s; }
      .b3 { animation-duration: 8.3s; animation-delay: -3.5s; }
      .b4 { animation-duration: 7.2s; animation-delay: -1.3s; }
      .b5 { animation-duration: 8.7s; animation-delay: -4.4s; }
      .b6 { animation-duration: 6.9s; animation-delay: -3.0s; }
      .spin { animation: drift-spin 4.6s linear infinite; }
      @keyframes drift-blink { 50% { opacity: 0; } }
      @keyframes drift-bob { 50% { transform: translateY(-6px); } }
      @keyframes drift-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .caret, .bob, .spin { animation: none; } }
    </style>
  </defs>

  <rect width="1080" height="800" fill="{{sunken-alt}}"/>
  <rect width="1080" height="800" fill="url(#halo)"/>
  <g filter="url(#windowShadow)"><rect x="24" y="24" width="1032" height="752" rx="20" fill="{{surface}}" stroke="{{line}}" stroke-width="1.2"/></g>

  <g clip-path="url(#appClip)">
    <rect x="24" y="24" width="1032" height="752" fill="{{surface}}"/>
<text x="1032" y="99" class="mono faint ui" font-size="9.5" text-anchor="end">v1.5 · 2026.11</text>

    <!-- 顶栏 -->
    <path d="M24 80h1032" stroke="{{line-soft}}"/>
    <rect x="44" y="38" width="27" height="27" rx="8" fill="url(#mark)"/>
    <use href="#i-send" x="49.5" y="43.5" width="16" height="16" color="{{on-accent}}"/>
    <text x="84" y="58" class="ink" font-size="18" font-weight="650" letter-spacing="-.02em">Drift</text>
    <text x="894" y="55" class="mono faint ui" font-size="10.5" text-anchor="end">4 台在线</text>
    <circle cx="906" cy="51.5" r="3.2" fill="{{accent}}"/>
    <use href="#i-folder" x="954" y="43" width="18" height="18" color="{{icon}}"/>
    <use href="#i-search" x="988" y="43" width="18" height="18" color="{{icon}}"/>
    <use href="#i-more" x="1022" y="43" width="18" height="18" color="{{icon}}"/>

    <!-- 会话：只留两条，球体浮在它上面 -->
    <rect x="180" y="104" width="26" height="26" rx="8" fill="{{idle}}"/>
    <use href="#i-file" x="185.5" y="109.5" width="15" height="15" color="{{muted}}"/>
    <text x="218" y="115" class="ink" font-size="12.5" font-weight="600">Drift-UI-Kit.fig</text>
    <text x="218" y="130" class="mono faint ui" font-size="10">来自 MacBook Pro · 24.8 MB</text>
    <text x="900" y="115" class="body" font-size="12.5" text-anchor="end">这版稿子周五前要定</text>
    <text x="900" y="130" class="mono faint ui" font-size="10" text-anchor="end">已送达 2 台 · 14:24</text>

    <!-- 声呐环：同一 Wi-Fi 的可达范围，圆心落在输入区下方 -->
    <g fill="none" stroke="{{accent-line}}" clip-path="url(#sonarClip)">
      <circle cx="540" cy="770" r="296" opacity=".5"/>
      <circle cx="540" cy="770" r="424" opacity=".32"/>
      <circle cx="540" cy="770" r="552" opacity=".18"/>
    </g>

    <text x="540" y="180" class="mono faint ui" font-size="10.5" text-anchor="middle">点按球体即发送 · 可以连续点几个</text>

    <!-- A · 客厅 Windows：最大、最亮，紫环走 68% -->
    <g class="bob b1">
      <circle cx="540" cy="306" r="76" fill="none" stroke="{{line-soft}}" stroke-width="2.2" stroke-dasharray="325 153" transform="rotate(-90 540 306)"/>
      <circle cx="540" cy="306" r="76" fill="{{accent}}" filter="url(#glow)" opacity=".13"/>
      <g class="spin">
        <circle cx="540" cy="306" r="76" fill="none" stroke="{{accent}}" stroke-width="3" stroke-linecap="round" stroke-dasharray="324 153" transform="rotate(-90 540 306)"/>
      </g>
      <circle cx="540" cy="306" r="64" fill="url(#orbHot)" stroke="{{line}}" stroke-width="1.2" filter="url(#orbShadow)"/>
      <ellipse cx="525" cy="284" rx="19" ry="10" transform="rotate(-28 525 284)" fill="url(#spec)"/>
      <use href="#i-monitor" x="526" y="286" width="28" height="28" color="{{accent}}"/>
      <text x="540" y="336" class="mono ui" font-size="11.5" font-weight="600" fill="{{accent-ink}}" text-anchor="middle">68%</text>
    </g>
    <text x="540" y="404" class="ink" font-size="12.5" font-weight="600" text-anchor="middle">客厅 Windows</text>
    <text x="540" y="420" class="mono faint ui" font-size="10" text-anchor="middle">18.2 MB/s · 点按暂停</text>

    <!-- B · MacBook Pro：内容改过，虚线环；差异只挂在这台球下 -->
    <g class="bob b2">
      <circle cx="330" cy="296" r="57" fill="none" stroke="{{delta-line}}" stroke-width="1.8" stroke-dasharray="4 6"/>
      <circle cx="330" cy="296" r="48" fill="url(#orb)" stroke="{{line}}" stroke-width="1.2" filter="url(#orbShadow)"/>
      <ellipse cx="318" cy="279" rx="14" ry="7.5" transform="rotate(-28 318 279)" fill="url(#spec)"/>
      <use href="#i-laptop" x="319" y="285" width="22" height="22" color="{{delta}}"/>
    </g>
    <text x="330" y="370" class="ink" font-size="12.5" font-weight="600" text-anchor="middle">MacBook Pro</text>
    <text x="330" y="386" class="mono ui" font-size="10" font-weight="600" fill="{{delta-ink}}" text-anchor="middle">曾发 11 字 · 补发 +12 字</text>

    <!-- C · iPhone 15：已同步，整环绿色 + 角标 -->
    <g class="bob b3">
      <circle cx="752" cy="288" r="48" fill="none" stroke="{{success}}" stroke-width="1.8" opacity=".7"/>
      <circle cx="752" cy="288" r="40" fill="url(#orb)" stroke="{{line}}" stroke-width="1.2" filter="url(#orbShadow)"/>
      <ellipse cx="742" cy="274" rx="12" ry="6.5" transform="rotate(-28 742 274)" fill="url(#spec)"/>
      <use href="#i-phone" x="743" y="279" width="19" height="19" color="{{muted}}"/>
      <circle cx="785" cy="321" r="8.5" fill="{{success}}"/>
      <use href="#i-check" x="780.5" y="316.5" width="9" height="9" color="{{on-accent}}"/>
    </g>
    <text x="752" y="354" class="ink" font-size="12.5" font-weight="600" text-anchor="middle">iPhone 15</text>
    <text x="752" y="370" class="mono faint ui" font-size="10" text-anchor="middle">已同步 · 刚刚送达</text>

    <!-- D · iPad Air：待发，无环 -->
    <g class="bob b4">
      <circle cx="232" cy="462" r="34" fill="url(#orb)" stroke="{{line}}" stroke-width="1.2" filter="url(#orbShadow)"/>
      <ellipse cx="223" cy="450" rx="10" ry="5.5" transform="rotate(-28 223 450)" fill="url(#spec)"/>
      <use href="#i-tablet" x="224" y="454" width="15" height="15" color="{{muted}}"/>
    </g>
    <text x="232" y="516" class="ink" font-size="12.5" font-weight="600" text-anchor="middle">iPad Air</text>
    <text x="232" y="532" class="mono faint ui" font-size="10" text-anchor="middle">点按发送</text>

    <!-- E · 工作室 PC：待发 -->
    <g class="bob b5">
      <circle cx="852" cy="456" r="32" fill="url(#orb)" stroke="{{line}}" stroke-width="1.2" filter="url(#orbShadow)"/>
      <ellipse cx="843" cy="445" rx="9" ry="5" transform="rotate(-28 843 445)" fill="url(#spec)"/>
      <use href="#i-monitor" x="844" y="448" width="15" height="15" color="{{muted}}"/>
    </g>
    <text x="852" y="508" class="ink" font-size="12.5" font-weight="600" text-anchor="middle">工作室 PC</text>
    <text x="852" y="524" class="mono faint ui" font-size="10" text-anchor="middle">点按发送</text>

    <!-- F · 书房 Mac mini：已暂停，24% 灰环，球面压暗 -->
    <g class="bob b6">
      <circle cx="540" cy="548" r="35" fill="none" stroke="{{flag}}" stroke-width="2" stroke-linecap="round" stroke-dasharray="53 167" transform="rotate(-90 540 548)"/>
      <circle cx="540" cy="548" r="28" fill="{{sunken}}" stroke="{{line-soft}}" stroke-width="1.1"/>
      <use href="#i-laptop" x="533" y="541" width="14" height="14" color="{{flag}}"/>
    </g>
    <text x="540" y="598" class="ink" font-size="12.5" font-weight="600" text-anchor="middle">书房 Mac mini</text>
    <text x="540" y="614" class="mono faint ui" font-size="10" text-anchor="middle">已暂停 24% · 点按继续</text>

    <!-- G · 添加设备：点开走配对流程，新设备直接落在这块画布上 -->
    <g class="bob b2">
      <circle cx="716" cy="560" r="40" fill="none" stroke="{{dropzone}}" stroke-width="1.4" stroke-dasharray="5 6"/>
      <circle cx="716" cy="560" r="32" fill="{{surface}}" stroke="{{line-soft}}" stroke-width="1.2"/>
      <path d="M716 548v24M704 560h24" stroke="{{accent-icon}}" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="716" y="620" class="ink" font-size="12.5" font-weight="600" text-anchor="middle">添加设备</text>
    <text x="716" y="636" class="mono faint ui" font-size="10" text-anchor="middle">新设备配对后落在这里</text>

    <!-- 无限画布：画布边缘露出被窗口裁掉的球 -->
    <g opacity=".55">
      <circle cx="46" cy="246" r="31" fill="url(#orb)" stroke="{{line}}" stroke-width="1.2"/>
      <use href="#i-phone" x="38" y="238" width="15" height="15" color="{{muted}}"/>
    </g>
    <g opacity=".55">
      <circle cx="1032" cy="600" r="34" fill="url(#orb)" stroke="{{line}}" stroke-width="1.2"/>
      <use href="#i-tablet" x="1024" y="592" width="16" height="16" color="{{muted}}"/>
    </g>

    <!-- 小地图：当前视口 + 窗外设备的位置 -->
    <rect x="892" y="150" width="96" height="58" rx="10" fill="{{sunken}}" stroke="{{line}}" stroke-width="1"/>
    <rect x="908" y="166" width="34" height="24" rx="4" fill="none" stroke="{{accent}}" stroke-width="1.2"/>
    <circle cx="922" cy="172" r="2.2" fill="{{accent}}"/>
    <circle cx="940" cy="164" r="2.2" fill="{{delta-fill}}"/>
    <circle cx="950" cy="182" r="2.2" fill="{{success}}"/>
    <circle cx="916" cy="196" r="2.2" fill="{{faint}}"/>
    <circle cx="968" cy="196" r="2.2" fill="{{faint}}"/>
    <text x="892" y="228" class="mono faint ui" font-size="10" text-anchor="start">拖动空白处平移 · 滚轮缩放</text>
    <!-- 输入区：没有发送键，也不标注差异，diff 只属于设备 -->
    <g filter="url(#composerHeat)">
      <rect x="96" y="660" width="888" height="76" rx="18" fill="{{surface}}" stroke="{{accent-line}}" stroke-width="1.2"/>
    </g>
    <rect x="114" y="683" width="30" height="30" rx="9" fill="{{idle}}"/>
    <use href="#i-plus" x="121" y="690" width="16" height="16" color="{{muted}}"/>
    <text x="158" y="703" class="ink" font-size="14.5">这版稿子周五前要定，工厂那边我下午再确认。</text>
    <rect x="466" y="687" width="1.6" height="18" rx=".8" fill="{{accent}}" class="caret"/>
    <rect x="466" y="687" width="1.6" height="18" rx=".8" fill="{{accent}}" filter="url(#blur2)" opacity=".7"/>
    <use href="#i-tray" x="852" y="690" width="15" height="15" color="{{muted}}"/>
    <text x="874" y="702" class="mono muted ui" font-size="11" font-weight="600">拖入文件</text>
  </g>
</svg>
