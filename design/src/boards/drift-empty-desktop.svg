<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="800" viewBox="0 0 1080 800" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Drift 桌面端空白引导</title>
  <desc id="desc">首次启动的桌面端空白状态，默认窗口宽 1080：用一台电脑与一台手机之间的传输路径说明流程，提供配对新设备入口，并列出配对、添加、送达三步；底部输入区在配对前保持禁用。</desc>
  <defs>
    <linearGradient id="canvas" x1="96" y1="20" x2="984" y2="782" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3F5FA"/>
      <stop offset="1" stop-color="#E5EAF2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="{{accent}}"/>
      <stop offset="1" stop-color="{{accent-strong}}"/>
    </linearGradient>
    <filter id="windowShadow" x="0" y="0" width="1080" height="800" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="26" flood-color="{{shadow}}" flood-opacity="0.14"/>
    </filter>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="190%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="{{shadow}}" flood-opacity="0.08"/>
    </filter>
    <clipPath id="appClip"><rect x="24" y="24" width="1032" height="752" rx="26"/></clipPath>
    <!-- @icons -->
    <style>
      text { font-family: Inter, "SF Pro Display", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .ink { fill: {{ink}}; }
      .body { fill: {{body}}; }
      .muted { fill: {{muted}}; }
      .faint { fill: {{faint}}; }
    </style>
  </defs>

  <rect width="1080" height="800" fill="url(#canvas)"/>
  <circle cx="1000" cy="56" r="176" fill="#DCDFFC" opacity=".3"/>
  <circle cx="56" cy="764" r="190" fill="#D8ECE8" opacity=".26"/>
  <g filter="url(#windowShadow)"><rect x="24" y="24" width="1032" height="752" rx="26" fill="{{surface}}"/></g>

  <g clip-path="url(#appClip)">
    <rect x="24" y="24" width="1032" height="752" fill="{{canvas}}"/>
    <!-- Toolbar -->
    <rect x="24" y="24" width="1032" height="72" fill="{{surface}}"/>
    <path d="M24 96h1032" stroke="#E9EBF1"/>
    <rect x="48" y="42" width="34" height="34" rx="11" fill="url(#accent)"/>
    <use href="#i-send" x="55" y="49" width="20" height="20" color="{{on-accent}}"/>
    <text x="94" y="67" class="ink" font-size="21" font-weight="750" letter-spacing="-.04em">Drift</text>

    <use href="#i-folder" x="762" y="51" width="18" height="18" color="{{muted}}"/>
    <text x="786" y="65" class="muted" font-size="12.5" font-weight="550">接收目录</text>
    <path d="M882 54h18M886 61h10M889 68h4" stroke="{{icon}}" stroke-width="1.7" stroke-linecap="round"/>
    <use href="#i-search" x="922" y="51" width="20" height="20" color="{{icon}}"/>
    <use href="#i-more" x="964" y="51" width="20" height="20" color="{{icon}}"/>
    <!-- Empty illustration: a transfer path, not a decorative blob -->
    <g>
      <rect x="380" y="176" width="76" height="76" rx="20" fill="{{surface}}" stroke="#E6E4F0" filter="url(#cardShadow)"/>
      <use href="#i-laptop" x="403" y="199" width="30" height="30" color="{{accent}}"/>
      <rect x="624" y="176" width="76" height="76" rx="20" fill="{{surface}}" stroke="#E6E4F0" filter="url(#cardShadow)"/>
      <use href="#i-phone" x="647" y="199" width="30" height="30" color="{{accent}}"/>

      <path d="M456 214C492 196 588 196 624 214" stroke="#D2CCF5" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 7"/>
      <circle cx="456" cy="214" r="2.6" fill="#C3BCF2"/>
      <circle cx="624" cy="214" r="2.6" fill="#C3BCF2"/>
      <path d="m616 206 6 5-6 5" stroke="#B7AFF0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

      <g filter="url(#cardShadow)">
        <rect x="482" y="148" width="116" height="40" rx="12" fill="{{surface}}" stroke="#DCD8F8"/>
      </g>
      <rect x="492" y="157" width="22" height="22" rx="7" fill="#F1EEFF"/>
      <use href="#i-file" x="496" y="161" width="14" height="14" color="{{file-ink}}"/>
      <text x="522" y="167" class="ink" font-size="10.5" font-weight="650">8.4 MB</text>
      <text x="522" y="178" fill="#8B84AE" font-size="8.5">传输中</text>

      <text x="418" y="278" class="muted" font-size="11" text-anchor="middle">这台电脑</text>
      <text x="662" y="278" class="muted" font-size="11" text-anchor="middle">iPhone 15</text>
    </g>
    <!-- Copy -->
    <text x="540" y="348" class="ink" font-size="24" font-weight="750" text-anchor="middle" letter-spacing="-.02em">把第一台设备连起来</text>
    <text x="540" y="380" class="muted" font-size="13" text-anchor="middle">同一 Wi-Fi 下 Drift 会自动发现附近设备，</text>
    <text x="540" y="402" class="muted" font-size="13" text-anchor="middle">配对时两端会显示同一组号码，核对一致即可。</text>

    <rect x="460" y="428" width="160" height="42" rx="14" fill="url(#accent)"/>
    <use href="#i-radar" x="495" y="440" width="18" height="18" color="{{on-accent}}"/>
    <text x="522" y="453" fill="{{on-accent}}" font-size="12.5" font-weight="650">配对新设备</text>
    <!-- Three steps, centered as a row -->
    <text x="340" y="516" fill="{{accent}}" font-size="10" font-weight="700" letter-spacing=".08em" text-anchor="middle">01</text>
    <text x="340" y="540" class="ink" font-size="12.5" font-weight="650" text-anchor="middle">配对设备</text>
    <text x="340" y="560" class="faint" font-size="10" text-anchor="middle">同一 Wi-Fi 自动发现</text>

    <text x="540" y="516" fill="{{accent}}" font-size="10" font-weight="700" letter-spacing=".08em" text-anchor="middle">02</text>
    <text x="540" y="540" class="ink" font-size="12.5" font-weight="650" text-anchor="middle">输入即弹出</text>
    <text x="540" y="560" class="faint" font-size="10" text-anchor="middle">有内容自动弹出设备层</text>

    <text x="740" y="516" fill="{{accent}}" font-size="10" font-weight="700" letter-spacing=".08em" text-anchor="middle">03</text>
    <text x="740" y="540" class="ink" font-size="12.5" font-weight="650" text-anchor="middle">点设备即发</text>
    <text x="740" y="560" class="faint" font-size="10" text-anchor="middle">无需发送键，改内容可增量补发</text>

    <text x="540" y="612" class="faint" font-size="10.5" text-anchor="middle">配对之后，收发记录会按时间出现在这里</text>
    <!-- Disabled composer (no send button) -->
    <rect x="96" y="660" width="888" height="76" rx="22" fill="#FBFBFD" stroke="#E6E7EE" stroke-width="1.2"/>
    <rect x="112" y="681" width="34" height="34" rx="11" fill="{{idle-alt}}"/>
    <use href="#i-plus" x="120" y="689" width="18" height="18" color="{{flag}}"/>
    <text x="164" y="703" fill="{{disabled}}" font-size="13.5">配对设备后，输入文本或拖入文件即自动弹出发送设备面板</text>
    <text x="1040" y="758" class="mono faint ui" font-size="9.5" text-anchor="end">v1.5 · 2026.11</text>
    <rect x="778" y="676" width="190" height="44" rx="14" fill="{{idle-alt}}" stroke="#E6E7EE" stroke-dasharray="6 5"/>
    <use href="#i-tray" x="798" y="689" width="18" height="18" color="{{flag}}"/>
    <text x="824" y="695" fill="{{disabled}}" font-size="11" font-weight="600">拖入文件</text>
    <text x="824" y="710" fill="{{disabled}}" font-size="9.5">配对后可用</text>
  </g>
</svg>
