[package]
name = "drift-gui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
nsh-core = "0.3.0"
nsh-base = "0.3.0"
env_logger = "0.11"
url = "2"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# Drift 核心：传输引擎与事件流（含 tokio broadcast）
drift = { path = ".." }
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.3.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.3.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.3.0", default-features = false }
